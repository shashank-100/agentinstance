# Fly.io deployment for the self-hostable Nimbus sandbox service.
# Deploy:  fly launch --copy-config --now   (first time)
#          fly deploy                        (subsequent)
#
# SANDBOX_TOKEN must be set as a secret before this is reachable — the /exec
# endpoint runs arbitrary shell commands:
#   fly secrets set SANDBOX_TOKEN=<random>

app = "nimbus-sandbox"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  SANDBOX_ROOT = "/workspaces"
  SANDBOX_TIMEOUT_MS = "30000"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero when idle so a parked agent costs nothing — the same
  # property Durable Object hibernation gives the agent host.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Agent workspaces live here. Without a volume they reset on each restart,
# which is fine for scratch work; add one if agents need durable files.
