<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nimbus — my agents</title>
<style>
  :root{--ink:#0c0a08;--ink-2:#14110d;--panel:#1a1611;--line:#2c2620;--ember:#f0954a;
    --ember-soft:#f7b878;--sky:#8fb3c9;--paper:#efe7d9;--muted:#9a8f7e;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;--serif:"Iowan Old Style",Palatino,Georgia,serif;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--ink);color:var(--paper);font-family:var(--mono);
    background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(240,149,74,0.10),transparent 60%);}
  .wrap{max-width:960px;margin:0 auto;padding:28px}
  nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{display:flex;gap:10px;font-weight:700}.brand .glyph{color:var(--ember)}
  nav a{color:var(--muted);text-decoration:none;font-size:.85rem;margin-left:20px}nav a:hover{color:var(--paper)}
  h1{font-family:var(--serif);font-weight:400;font-size:2rem;margin:24px 0 4px}
  .sub{color:var(--muted);margin-bottom:26px}
  .new{background:var(--ember);color:var(--ink);text-decoration:none;padding:9px 16px;border-radius:9px;font-weight:600;font-size:.85rem}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;color:var(--muted);font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--line)}
  td{padding:14px 12px;border-bottom:1px solid var(--line);font-size:.88rem}
  tr:hover td{background:var(--ink-2)}
  .id{color:var(--ember-soft)}
  .badge{font-size:.72rem;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
  .live{color:#7ec98f;border-color:#2f5138}.parked{color:var(--muted)}
  .act{color:var(--sky);text-decoration:none;cursor:pointer;font-size:.8rem;margin-right:12px}.act:hover{color:var(--ember)}
  .empty{color:var(--muted);text-align:center;padding:60px 0}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <div class="brand"><span class="glyph">⌇</span> Nimbus</div>
    <div>
      <a href="/agents/">My Agents</a>
      <a href="/channels/">Channels</a>
      <a href="/agents/new.html">New Agent</a>
    </div>
  </nav>
  <div style="display:flex;justify-content:space-between;align-items:flex-end">
    <div>
      <h1>My Agents</h1>
      <p class="sub">Every agent you've launched. Parked agents are free.</p>
    </div>
    <div style="display:flex;gap:10px">
      <button class="new" id="clone" style="border:none;cursor:pointer">⇪ Clone from local</button>
      <a class="new" href="/agents/new.html">＋ New agent</a>
    </div>
  </div>
  <input type="file" id="clonefile" accept="application/json" style="display:none" />

  <table id="tbl">
    <thead><tr><th>Agent</th><th>Model</th><th>Harness</th><th>Machine</th><th>Status</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="empty" style="display:none">No agents yet — <a class="act" href="/agents/new.html">create your first →</a></div>
</div>

<script>
async function load() {
  const rows = document.getElementById("rows");
  const agents = await (await fetch("/api/agents")).json();
  if (!agents.length) { document.getElementById("tbl").style.display = "none"; document.getElementById("empty").style.display = "block"; return; }
  rows.innerHTML = "";
  for (const a of agents) {
    const tr = document.createElement("tr");
    const status = a.parked
      ? `<span class="badge parked">parked · free</span>`
      : `<span class="badge live">● live</span>`;
    const toggle = a.parked
      ? `<a class="act" data-act="unpark" data-id="${a.id}">unpark</a>`
      : `<a class="act" data-act="park" data-id="${a.id}">park</a>`;
    tr.innerHTML = `<td class="id">${a.id}</td><td>${a.model}</td><td>${a.harness}</td>`
      + `<td>${a.machine}</td><td>${status}</td>`
      + `<td><a class="act" href="/chat.html?id=${a.id}">chat</a>${toggle}`
      + `<a class="act" data-del="${a.id}" style="color:#c98f8f">delete</a></td>`;
    rows.appendChild(tr);
  }
  rows.querySelectorAll("[data-act]").forEach((el) => {
    el.onclick = async () => {
      await fetch(`/agents/${el.dataset.id}/${el.dataset.act}`, { method: "POST" });
      load();
    };
  });
  rows.querySelectorAll("[data-del]").forEach((el) => {
    el.onclick = async () => {
      if (!confirm(`Delete agent ${el.dataset.del}? This erases its history.`)) return;
      await fetch(`/agents/${el.dataset.del}`, { method: "DELETE" });
      load();
    };
  });
}

// Clone from local: pick a JSON file (spec + history), push it to a new agent.
document.getElementById("clone").onclick = () => document.getElementById("clonefile").click();
document.getElementById("clonefile").onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const local = JSON.parse(await file.text());
  const id = local.id || prompt("New agent id:", "cloned-" + Date.now());
  if (!id) return;
  // register it, then restore its state
  await fetch("/api/launch", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ id, ...(local.spec || {}) }),
  });
  await fetch(`/agents/${id}/restore`, {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ spec: local.spec, history: local.history || [], kv: local.kv || {} }),
  });
  load();
};

load();
</script>
</body>
</html>
