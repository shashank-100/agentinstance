<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>agentinstance — my agents</title>
<style>
  /* Light palette, matching the chat playground. Token names are unchanged so
     the rest of the sheet keeps working: --ink is now text, --paper the page. */
  :root{--ink:#18181b;--ink-2:#fafafa;--panel:#f4f4f5;--line:#e8e8e8;--ember:#2563eb;
    --ember-soft:#1d4ed8;--sky:#2563eb;--paper:#ffffff;--muted:#71717a;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;
    --serif:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;}
  .wrap{max-width:960px;margin:0 auto;padding:28px}
  nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{display:flex;gap:10px;font-weight:700}.brand .glyph{color:var(--ember)}
  nav a{color:var(--muted);text-decoration:none;font-size:.85rem;margin-left:20px}nav a:hover{color:var(--ink)}
  h1{font-family:var(--serif);font-weight:400;font-size:2rem;margin:24px 0 4px}
  .sub{color:var(--muted);margin-bottom:26px}
  .new{background:var(--ember);color:#fff;text-decoration:none;padding:9px 16px;border-radius:9px;font-weight:600;font-size:.85rem}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;color:var(--muted);font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--line)}
  td{padding:14px 12px;border-bottom:1px solid var(--line);font-size:.88rem}
  tr:hover td{background:var(--ink-2)}
  .id{color:var(--ember-soft)}
  .badge{font-size:.72rem;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
  .live{color:#16a34a;border-color:#bbf7d0;background:#f0fdf4}
  .act{color:var(--sky);text-decoration:none;cursor:pointer;font-size:.8rem;margin-right:12px}.act:hover{color:var(--ember)}
  .empty{color:var(--muted);text-align:center;padding:60px 0}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <div class="brand"><span class="glyph">⌇</span> agentinstance</div>
    <div>
      <a href="/agents/">My Agents</a>
      <a href="/agents/new.html">New Agent</a>
    </div>
  </nav>
  <div style="display:flex;justify-content:space-between;align-items:flex-end">
    <div>
      <h1>My Agents</h1>
      <p class="sub">Every agent you've launched.</p>
    </div>
    <div style="display:flex;gap:10px">
      <a class="new" href="/agents/new.html">＋ New agent</a>
    </div>
  </div>
  <table id="tbl">
    <thead><tr><th>Agent</th><th>Model</th><th>Harness</th><th>Machine</th><th>Status</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="empty" style="display:none">No agents yet — <a class="act" href="/agents/new.html">create your first →</a></div>

  <!-- The work queue. Hidden until there is something in it: an empty table
       on every dashboard would be noise for anyone not using tasks. -->
  <div id="fleet" style="display:none;margin-top:38px">
    <h1 style="font-size:1.05rem">Tasks</h1>
    <p class="sub" id="fleetSummary"></p>
    <table>
      <thead><tr><th>Goal</th><th>State</th><th>Agent</th><th>Branch</th><th>PR</th></tr></thead>
      <tbody id="taskRows"></tbody>
    </table>
  </div>
</div>

<script>
async function load() {
  const rows = document.getElementById("rows");
  const agents = await (await fetch("/api/agents")).json();
  if (!agents.length) { document.getElementById("tbl").style.display = "none"; document.getElementById("empty").style.display = "block"; return; }
  rows.innerHTML = "";
  for (const a of agents) {
    const tr = document.createElement("tr");
    const status = `<span class="badge live">● live</span>`;
    // Agent names are chosen by whoever launched them, so they are escaped
    // rather than interpolated: a name is user input reaching innerHTML.
    const id = esc(a.id);
    tr.innerHTML = `<td class="id">${id}</td><td>${esc(a.model)}</td><td>${esc(a.harness)}</td>`
      + `<td>${esc(a.machine)}</td><td>${status}</td>`
      + `<td><a class="act" href="/chat?id=${encodeURIComponent(a.id)}">chat</a>`
      + `<a class="act" data-del="${id}" style="color:#dc2626">delete</a></td>`;
    rows.appendChild(tr);
  }
  rows.querySelectorAll("[data-del]").forEach((el) => {
    el.onclick = async () => {
      if (!confirm(`Delete agent ${el.dataset.del}? This erases its history.`)) return;
      await fetch(`/agents/${el.dataset.del}`, { method: "DELETE" });
      /** The task queue, when there is one. */
async function loadFleet() {
  const box = document.getElementById("fleet");
  let tasks = [];
  try {
    tasks = await (await fetch("/api/fleet/tasks")).json();
  } catch { /* a deployment without the binding simply has no queue */ }
  if (!Array.isArray(tasks) || !tasks.length) { box.style.display = "none"; return; }

  const counts = tasks.reduce((acc, t) => ((acc[t.state] = (acc[t.state] ?? 0) + 1), acc), {});
  document.getElementById("fleetSummary").textContent =
    ["queued", "running", "settled", "failed"]
      .filter((k) => counts[k])
      .map((k) => `${counts[k]} ${k}`)
      .join(" · ");

  const rows = document.getElementById("taskRows");
  rows.innerHTML = "";
  for (const t of tasks) {
    const tr = document.createElement("tr");
    const pr = t.prUrl
      ? `<a class="act" href="${esc(t.prUrl)}" target="_blank" rel="noopener">open</a>`
      : "—";
    tr.innerHTML =
      `<td>${esc(t.goal)}</td>` +
      `<td><span class="badge">${esc(t.state)}</span></td>` +
      `<td class="id">${esc(t.assignedTo ?? "—")}</td>` +
      `<td class="id">${esc(t.branch ?? "—")}</td>` +
      `<td>${pr}</td>`;
    rows.appendChild(tr);
  }
  box.style.display = "block";
}

/** Task text is whatever the caller filed, so it is escaped before display. */
function esc(v) {
  return String(v ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

load();
loadFleet();
    };
  });
}

load();

// Agents can be created or deleted from another tab, the API, or the builder,
// and a dashboard left open otherwise keeps showing whatever was true when it
// loaded. Refresh when the tab is looked at again rather than polling: the
// list only matters while someone is reading it.
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) { load(); loadFleet(); }
});
window.addEventListener("focus", () => { load(); loadFleet(); });
</script>
</body>
</html>
