<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nimbus — chat</title>
<style>
  :root{--ink:#0c0a08;--ink-2:#14110d;--panel:#1a1611;--line:#2c2620;--ember:#f0954a;
    --ember-soft:#f7b878;--sky:#8fb3c9;--paper:#efe7d9;--muted:#9a8f7e;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;--serif:"Iowan Old Style",Palatino,Georgia,serif;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--ink);color:var(--paper);font-family:var(--mono);height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line)}
  .brand{display:flex;gap:10px;font-weight:700}.brand .glyph{color:var(--ember)}
  .who{color:var(--muted);font-size:.82rem}.who .id{color:var(--ember-soft)}
  header a{color:var(--muted);text-decoration:none;font-size:.82rem}header a:hover{color:var(--paper)}
  #log{flex:1;overflow-y:auto;padding:24px;max-width:760px;margin:0 auto;width:100%}
  .msg{margin-bottom:16px;display:flex}
  .msg.user{justify-content:flex-end}
  .bubble{max-width:75%;padding:11px 15px;border-radius:14px;font-size:.9rem;line-height:1.45}
  .user .bubble{background:var(--ember);color:var(--ink);border-bottom-right-radius:4px}
  .assistant .bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
  .role{font-size:.68rem;color:var(--muted);margin:0 6px 4px;align-self:flex-end}
  form{display:flex;gap:10px;padding:16px 24px;border-top:1px solid var(--line);max-width:760px;margin:0 auto;width:100%}
  input{flex:1;background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:12px 15px;color:var(--paper);font-family:var(--mono);font-size:.9rem}
  input:focus{outline:none;border-color:var(--ember)}
  button{background:var(--ember);color:var(--ink);border:none;border-radius:10px;padding:0 20px;font-weight:600;cursor:pointer;font-family:var(--mono)}
  .hint{color:var(--muted);text-align:center;font-size:.75rem;padding:8px}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="glyph">⌇</span> Nimbus</div>
  <div class="who">agent <span class="id" id="who">—</span></div>
  <a href="/agents/">← all agents</a>
</header>
<div id="log"></div>
<div class="hint" id="hint"></div>
<form id="form">
  <input id="input" placeholder="Message your agent…" autocomplete="off" autofocus />
  <button type="submit">Send</button>
</form>
<script>
const id = new URLSearchParams(location.search).get("id") || "default";
document.getElementById("who").textContent = id;
const log = document.getElementById("log");

function add(role, content) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  wrap.innerHTML = `<div class="bubble">${escapeHtml(content)}</div>`;
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
}
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

async function loadHistory() {
  const hist = await (await fetch(`/agents/${id}/history`)).json();
  for (const m of hist) if (m.role === "user" || m.role === "assistant") add(m.role, m.content);
  if (!hist.length) document.getElementById("hint").textContent = "Say hello to start. (Demo mode uses a mock model — add an API key for a real one.)";
}

document.getElementById("form").onsubmit = async (e) => {
  e.preventDefault();
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  document.getElementById("hint").textContent = "";
  add("user", text);
  const res = await fetch(`/agents/${id}/send`, {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ text, channel: "web" }),
  });
  const data = await res.json();
  add("assistant", res.ok ? data.reply : `(${data.error || "error"})`);
};

loadHistory();
</script>
</body>
</html>
