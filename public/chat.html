<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>agentinstance — playground</title>
<style>
  :root{
    --bg:#ffffff; --rail:#fafafa; --rail-2:#f4f4f5;
    --line:#e8e8e8; --line-2:#ededed;
    --ink:#18181b; --ink-2:#3f3f46; --muted:#71717a; --faint:#a1a1aa;
    --accent:#2563eb; --accent-ink:#1d4ed8;
    --ok:#16a34a; --ok-bg:#f0fdf4; --ok-line:#bbf7d0;
    --pill:#f4f4f5; --dark:#18181b;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
    /* One full-height row: without it the row sizes to content and both
       columns stop short of the viewport, leaving dead space below. */
    display:grid;grid-template-columns:272px 1fr;grid-template-rows:100%;
    height:100vh;overflow:hidden}

  /* ---------- agent list ---------- */
  .cols{border-right:1px solid var(--line);display:flex;flex-direction:column;
    padding:16px 14px;gap:5px;overflow-y:auto;background:var(--rail)}
  .cols .brand{display:flex;align-items:center;gap:9px;font-size:1.1rem;font-weight:700;
    letter-spacing:-.02em;padding:2px 6px 16px}
  .cols .brand svg{flex:none}
  .cols h2{display:flex;align-items:center;gap:9px;font-size:.94rem;font-weight:600;
    padding:4px 6px 12px;color:var(--ink)}
  .cols .foot{display:flex;align-items:center;gap:14px;padding:12px 6px 4px;
    margin-top:10px;border-top:1px solid var(--line-2);
    font-size:.82rem;color:var(--muted)}
  .cols .foot a{color:inherit;text-decoration:none}
  .cols .foot a:hover{color:var(--ink)}
  .cols .foot .grow{flex:1}
  .col{display:flex;align-items:flex-start;gap:9px;border:1px solid var(--line);
    border-radius:11px;padding:11px 12px;cursor:pointer;background:var(--bg)}
  .col:hover{border-color:#d4d4d8}
  .col.on{background:var(--rail-2);border-color:#d4d4d8}
  .col .star{width:7px;height:7px;border-radius:50%;background:var(--ok);
    flex:none;margin-top:6px}
  .col .star.off{background:var(--faint)}
  .col .body{flex:1;min-width:0}
  .col .del{background:none;border:none;color:var(--faint);cursor:pointer;
    font-size:1rem;line-height:1;padding:2px 4px;opacity:0;flex:none}
  .col:hover .del{opacity:1}
  .col .del:hover{color:#dc2626}
  .col .nm{font-size:.88rem;font-weight:600;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  /* The upstream arrow makes this line long; wrap rather than truncate it. */
  .col .mdl{font-family:var(--mono);font-size:.75rem;color:var(--muted);
    overflow-wrap:anywhere;line-height:1.4}
  .addnew{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:11px;
    font-size:.88rem;color:var(--ink-2);cursor:pointer}
  .addnew:hover{background:var(--rail-2)}
  .addnew .ico{color:var(--muted)}
  .newsession{margin-top:auto;background:var(--dark);color:#fff;border:none;
    border-radius:12px;padding:13px;font-family:var(--sans);font-size:.9rem;
    font-weight:600;cursor:pointer;display:flex;align-items:center;
    justify-content:center;gap:8px}
  .newsession:hover{background:#27272a}

  /* ---------- main ---------- */
  main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);min-height:0}
  .chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);
    background:var(--bg);border-radius:9px;padding:6px 12px;font-size:.83rem;
    color:var(--ink-2);cursor:pointer;margin-top:11px}
  .chip:hover{border-color:#d4d4d8}

  .agenthead{padding:18px 26px 0;background:var(--rail);
    border-bottom:1px solid var(--line)}
  .ahtop{display:flex;align-items:center;gap:11px}
  .ahtop .nm{font-weight:700;font-size:1rem}
  .ahtop .mdl{font-family:var(--mono);font-size:.88rem;color:var(--ink-2)}
  .ahtop .grow{flex:1}
  .status{display:inline-flex;align-items:center;gap:6px;background:var(--ok-bg);
    border:1px solid var(--ok-line);color:var(--ok);border-radius:999px;
    padding:3px 11px;font-size:.79rem;font-weight:500}
  .status .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
  .status.off{background:var(--rail-2);border-color:var(--line);color:var(--muted)}
  .status.off .dot{background:var(--faint)}
  .iconbtn{color:var(--muted);cursor:pointer;font-size:.95rem;
    background:none;border:none;padding:3px}
  .iconbtn:hover{color:var(--ink)}
  .stats{display:flex;align-items:center;gap:7px;margin-top:7px;
    font-size:.86rem;color:var(--ink-2)}
  .stats .sep{color:var(--faint)}
  .stats .turns{margin-left:auto;color:var(--muted)}

  #log{flex:1;min-height:0;overflow-y:auto;padding:30px 26px 10px}
  .inner{max-width:920px;margin:0 auto}
  .msg{margin-bottom:26px;display:flex}
  .msg.user{justify-content:flex-end}
  .user .bubble{background:var(--pill);border-radius:16px;padding:10px 17px;
    max-width:70%;font-size:.94rem}
  .assistant .bubble{max-width:100%;font-size:.96rem;line-height:1.62;color:var(--ink)}
  .bubble p{margin:0 0 .95em}.bubble p:last-child{margin-bottom:0}
  .bubble h3,.bubble h4,.bubble h5,.bubble h6{margin:1.1em 0 .45em;
    font-size:1rem;line-height:1.35;font-weight:650}
  .bubble h3:first-child,.bubble h4:first-child{margin-top:0}
  .bubble ul,.bubble ol{margin:.5em 0 .95em;padding-left:1.35em}
  .bubble li{margin:.3em 0}
  .bubble code{background:var(--rail-2);padding:.13em .4em;border-radius:5px;
    font-family:var(--mono);font-size:.86em}
  .bubble pre.code{background:#fafafa;border:1px solid var(--line);border-radius:10px;
    padding:13px 15px;margin:.75em 0;overflow-x:auto}
  .bubble pre.code code{background:none;padding:0;font-size:.83rem;line-height:1.6}
  .bubble a{color:var(--accent)}
  .bubble strong{font-weight:650}
  .thinking{color:var(--muted);font-size:.92rem;font-style:italic}
  .empty{color:var(--faint);text-align:center;padding:60px 20px;font-size:.92rem}

  .composer{padding:14px 26px 22px}
  .cwrap{max-width:920px;margin:0 auto;border:1px solid var(--line);border-radius:22px;
    padding:14px 16px 11px;background:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .cwrap:focus-within{border-color:#d4d4d8}
  .cwrap textarea{width:100%;border:none;outline:none;resize:none;font-family:var(--sans);
    font-size:.96rem;line-height:1.5;color:var(--ink);background:none;
    max-height:200px;min-height:26px}
  .cwrap textarea::placeholder{color:var(--faint)}
  .crow{display:flex;align-items:center;gap:11px;margin-top:9px}
  .crow .mdl{font-family:var(--mono);font-size:.82rem;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crow .grow{flex:1}
  .send{width:33px;height:33px;border-radius:50%;background:var(--dark);color:#fff;
    border:none;cursor:pointer;display:grid;place-items:center;font-size:.95rem;flex:none}
  .send:hover{background:#27272a}
  .send:disabled{background:#d4d4d8;cursor:default}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
    background:var(--dark);color:#fff;border-radius:9px;padding:9px 17px;
    font-size:.86rem;opacity:0;pointer-events:none;transition:opacity .18s}
  .toast.show{opacity:1}

  @media (max-width:1100px){ body{grid-template-columns:232px 1fr} }
  @media (max-width:760px){
    body{grid-template-columns:1fr}
    .cols{display:none}
  }
</style>
</head>
<body>

<!-- ================= agent list ================= -->
<aside class="cols">
  <a class="brand" href="/agents/" style="text-decoration:none;color:inherit">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M4 15a4 4 0 014-4 5 5 0 019.6-1.4A3.5 3.5 0 1118 17H8a4 4 0 01-4-2z"
            stroke="#2563eb" stroke-width="1.8" stroke-linejoin="round"/>
    </svg>
    agentinstance
  </a>

  <h2><span aria-hidden="true">◫</span> Agents <span id="cmpCount"
      style="color:var(--muted);font-weight:400">0</span></h2>
  <div id="colList"></div>
  <div class="addnew" id="addNew"><span class="ico" aria-hidden="true">◫</span> Add new</div>
  <button class="newsession" id="newSession">＋ New session</button>

  <div class="foot">
    <a href="/agents/">My Agents <span id="agentCount">—</span></a>
    <span class="grow"></span>
    <a href="https://github.com/shashank-100/agentinstance#readme"
       target="_blank" rel="noopener">Docs</a>
  </div>
</aside>

<!-- ================= main ================= -->
<main>
  <section class="agenthead">
    <div class="ahtop">
      <span class="nm" id="agentName">—</span>
      <span class="mdl" id="agentModel">—</span>
      <span class="grow"></span>
      <span class="status" id="agentStatus"><span class="dot"></span><span>Ready</span></span>
      <button class="iconbtn" id="openRaw" title="Open raw history">↗</button>
      <button class="iconbtn" id="parkBtn" title="Park agent">▤</button>
    </div>
    <div class="stats">
      <!-- Reseller publishes no rates; these are the upstream list prices. -->
      <span>Est. rate <b id="stCost">—</b></span><span class="sep">·</span>
      <span>Last reply <b id="stDur">—</b></span>
      <span class="turns"><b id="stTurns">0</b> turns</span>
    </div>
  </section>

  <div id="log"><div class="inner" id="logInner"></div></div>

  <section class="composer">
    <div class="cwrap">
      <textarea id="input" rows="1" placeholder="Message this session…"></textarea>
      <div class="crow">
        <span class="chip" style="margin:0;padding:5px 11px;font-size:.8rem"
              id="connectApps2"><span aria-hidden="true">⊞</span> Connect apps</span>
        <span aria-hidden="true" style="color:var(--faint)">📎</span>
        <span class="mdl" id="composerModel">—</span>
        <span class="grow"></span>
        <span aria-hidden="true" style="color:var(--faint)">🎤</span>
        <button class="send" id="send" title="Send">↑</button>
      </div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
/* ------------------------------------------------------------------ state */
const qs = new URLSearchParams(location.search);
let agentId = qs.get("id") || "default";
let agents = [];            // registry records
let catalog = null;         // /catalog payload
let turns = 0;

const $ = (id) => document.getElementById(id);
const log = $("logInner");

function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}

/* ------------------------------------------------------------- rendering */
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

/* Minimal markdown for model replies: headings, bold/italic, code, lists, links.
   Everything is HTML-escaped FIRST, so tags in a reply can never execute — we
   only ever add markup to already-inert text. */
function renderMarkdown(src) {
  const codeBlocks = [];
  let s = escapeHtml(String(src ?? ""));

  // Pull fenced blocks out before inline rules can touch their contents.
  s = s.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, body) => {
    codeBlocks.push(`<pre class="code"><code>${body.replace(/\n$/, "")}</code></pre>`);
    return ` CODE${codeBlocks.length - 1} `;
  });

  const inline = (t) =>
    t
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>")
      // Only linkify http(s) — javascript: and data: URLs must never survive.
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

  const out = [];
  let list = null; // "ul" | "ol" | null
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };

  for (const raw of s.split("\n")) {
    const line = raw.trimEnd();

    if (/^ CODE\d+ $/.test(line.trim())) { closeList(); out.push(line.trim()); continue; }

    const heading = line.match(/^(#{1,4})\s+(.*)$/);
    if (heading) {
      closeList();
      const lvl = Math.min(heading[1].length + 2, 6);
      out.push(`<h${lvl}>${inline(heading[2])}</h${lvl}>`);
      continue;
    }
    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    if (ul) {
      if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; }
      out.push(`<li>${inline(ul[1])}</li>`);
      continue;
    }
    const ol = line.match(/^\s*\d+\.\s+(.*)$/);
    if (ol) {
      if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; }
      out.push(`<li>${inline(ol[1])}</li>`);
      continue;
    }
    if (!line.trim()) { closeList(); continue; }
    closeList();
    out.push(`<p>${inline(line)}</p>`);
  }
  closeList();
  return out.join("").replace(/ CODE(\d+) /g, (_, i) => codeBlocks[Number(i)]);
}

function add(role, content) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  wrap.innerHTML = `<div class="bubble">${renderMarkdown(content)}</div>`;
  log.appendChild(wrap);
  $("log").scrollTop = $("log").scrollHeight;
  return wrap;
}

function pending() {
  const wrap = document.createElement("div");
  wrap.className = "msg assistant";
  wrap.innerHTML = `<div class="bubble thinking">thinking…</div>`;
  log.appendChild(wrap);
  $("log").scrollTop = $("log").scrollHeight;
  return wrap;
}

/* --------------------------------------------------------------- columns */
function renderColumns() {
  const list = $("colList");
  list.innerHTML = "";
  // The active agent always shows, even before the registry has caught up.
  const rows = agents.length ? agents : [{ id: agentId, model: "—", harness: "chat" }];
  for (const a of rows) {
    const el = document.createElement("div");
    el.className = "col" + (a.id === agentId ? " on" : "");
    el.innerHTML =
      `<span class="star"></span>
       <div class="body">
         <div class="nm"></div>
         <div class="mdl"></div>
       </div>
       <button class="del" title="Delete agent">×</button>`;
    // The agent's own id names it; the harness/model pair is what it runs on.
    el.querySelector(".star").className = "star" + (a.parked ? " off" : "");
    el.querySelector(".nm").textContent = a.id;
    el.querySelector(".mdl").textContent =
      [a.harness, a.model ? modelLabel(a.model) : null].filter(Boolean).join(" · ") || "—";
    el.onclick = () => switchAgent(a.id);
    el.querySelector(".del").onclick = (e) => {
      e.stopPropagation(); // don't also switch to the agent we're deleting
      removeAgent(a.id);
    };
    list.appendChild(el);
  }
  $("cmpCount").textContent = rows.length;
  $("agentCount").textContent = agents.length || "—";
}

/* A catalog id can resolve to a different name upstream; show what the
   provider actually receives when the two differ. */
function modelLabel(id) {
  const info = catalog?.models?.find((m) => m.id === id);
  if (!info) return id;
  return info.upstreamId && info.upstreamId !== info.id
    ? `${info.id} → ${info.upstreamId}`
    : info.id;
}

function renderHead() {
  const rec = agents.find((a) => a.id === agentId);
  const model = rec?.model || catalog?.models?.[0]?.id || "—";
  const runs = [rec?.harness, modelLabel(model)].filter(Boolean).join(" · ");
  $("agentName").textContent = agentId;
  $("agentModel").textContent = runs;
  $("composerModel").textContent = runs;

  const st = $("agentStatus");
  const parked = rec?.parked;
  st.className = "status" + (parked ? " off" : "");
  st.lastElementChild.textContent = parked ? "Parked" : "Ready";
  $("parkBtn").title = parked ? "Unpark agent" : "Park agent";

  // Cost is estimable only once we know the model's per-token price.
  const info = catalog?.models?.find((m) => m.id === model);
  $("stCost").textContent = info ? `$${info.priceIn}/${info.priceOut} per 1M` : "—";
  $("stTurns").textContent = turns;
}

/* ------------------------------------------------------------------ data */
async function loadCatalog() {
  try { catalog = await (await fetch("/catalog")).json(); } catch { catalog = null; }
}

async function loadAgents() {
  try {
    agents = await (await fetch("/api/agents")).json();
    if (!Array.isArray(agents)) agents = [];
  } catch { agents = []; }
  // Keep the URL's agent selected; otherwise fall back to the first known one.
  if (!agents.some((a) => a.id === agentId) && agents.length) agentId = agents[0].id;
  renderColumns();
  renderHead();
}

async function loadHistory() {
  log.innerHTML = "";
  turns = 0;
  let hist = [];
  try { hist = await (await fetch(`/agents/${agentId}/history`)).json(); } catch {}
  if (!Array.isArray(hist)) hist = [];
  for (const m of hist) {
    if (m.role === "user" || m.role === "assistant") {
      add(m.role, m.content);
      if (m.role === "assistant") turns++;
    }
  }
  if (!hist.length) {
    log.innerHTML =
      `<div class="empty">No messages yet — send one above to start this session.<br>
       Demo mode uses a mock model; add an API key for a real one.</div>`;
  }
  $("stTurns").textContent = turns;
}

/* Wipes the agent's state and drops it from the registry. Not undoable, so it
   asks first — and never leaves the page pointed at a deleted agent. */
async function removeAgent(id) {
  if (!confirm(`Delete agent "${id}"? Its history and state are wiped.`)) return;
  try {
    const res = await fetch(`/agents/${id}`, { method: "DELETE" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
  } catch (e) {
    toast(`Could not delete: ${String(e)}`);
    return;
  }
  toast(`Deleted ${id}`);
  const wasCurrent = id === agentId;
  await loadAgents();
  if (wasCurrent) {
    // Fall back to whatever agent remains; loadAgents already repointed agentId
    // if the old one is gone, so just re-read the conversation.
    history.replaceState(null, "", `?id=${encodeURIComponent(agentId)}`);
    renderHead();
    await loadHistory();
  }
}

async function switchAgent(id) {
  if (id === agentId) return;
  agentId = id;
  history.replaceState(null, "", `?id=${encodeURIComponent(id)}`);
  renderColumns();
  renderHead();
  await loadHistory();
}

/* --------------------------------------------------------------- sending */
let sending = false;

async function send(text) {
  if (!text || sending) return;
  sending = true;
  $("send").disabled = true;
  add("user", text);
  const ph = pending();
  const t0 = performance.now();
  try {
    const res = await fetch(`/agents/${agentId}/send`, {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ text, channel: "web" }),
    });
    const data = await res.json();
    ph.remove();
    add("assistant", res.ok ? data.reply : `(${data.error || "error"})`);
    if (res.ok) {
      turns++;
      $("stTurns").textContent = turns;
      $("stDur").textContent = `${((performance.now() - t0) / 1000).toFixed(1)}s`;
    }
  } catch (e) {
    ph.remove();
    add("assistant", `(network error: ${String(e)})`);
  } finally {
    sending = false;
    $("send").disabled = false;
  }
}

/* ------------------------------------------------------------------ wire */
const input = $("input");
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 200) + "px";
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    const t = input.value.trim();
    input.value = ""; input.style.height = "auto";
    send(t);
  }
});
$("send").onclick = () => {
  const t = input.value.trim();
  input.value = ""; input.style.height = "auto";
  send(t);
};

$("newSession").onclick = async () => {
  if (!confirm("Clear this session's history?")) return;
  try {
    await fetch(`/agents/${agentId}/configure`, {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({}),
    });
  } catch {}
  await loadHistory();
  toast("New session started");
};

$("addNew").onclick = () => { location.href = "/agents/new.html"; };
$("openRaw").onclick = () => window.open(`/agents/${agentId}/history`, "_blank");

$("parkBtn").onclick = async () => {
  const rec = agents.find((a) => a.id === agentId);
  const action = rec?.parked ? "unpark" : "park";
  try {
    await fetch(`/agents/${agentId}/${action}`, { method: "POST" });
    toast(action === "park" ? "Agent parked" : "Agent unparked");
    await loadAgents();
  } catch { toast("Could not reach agent"); }
};

$("connectApps2").onclick = () =>
  toast("Capabilities are set when you launch an agent");

/* ------------------------------------------------------------------ boot */
(async function boot() {
  await loadCatalog();
  await loadAgents();
  await loadHistory();
  renderHead();
})();
</script>
</body>
</html>
